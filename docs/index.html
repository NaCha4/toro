<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f3" />
    <meta
      name="description"
      content="토로 3D 모델의 16가지 표정과 애니메이션을 전환해 보세요."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>토로 3D</title>
  <link rel="stylesheet" href="./assets/app-V44KPUF7.css" />
</head>
  <body>
    <main aria-label="토로 3D 뷰어">
      <div id="viewport"></div>
      <div id="loading" role="status">모델을 불러오는 중…</div>
      <div class="controls" aria-label="모델 조작">
        <div class="control-section">
          <span class="control-label" id="expression-label">표정</span>
          <div
            id="expression-controls"
            class="expression-grid"
            role="group"
            aria-labelledby="expression-label"
          ></div>
        </div>
        <div class="control-section animation-section">
          <span class="control-label" id="animation-label">애니메이션</span>
          <div
            class="animation-buttons"
            role="group"
            aria-labelledby="animation-label"
          >
            <button
              type="button"
              data-pose="stand"
              class="selected"
              aria-pressed="true"
            >
              기본
            </button>
            <button type="button" data-pose="wave" aria-pressed="false">
              인사
            </button>
            <button type="button" data-pose="dance" aria-pressed="false">
              춤추기
            </button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./assets/app-6DYPYXSH.js"></script>
  </body>
</html>
