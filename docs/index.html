<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8e3d7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="토로의 방" />
    <meta
      name="description"
      content="토로 3D 모델의 16가지 표정과 애니메이션을 전환해 보세요."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>토로의 방</title>
  <link rel="stylesheet" href="./assets/app-LXVGR2FA.css" />
</head>
  <body>
    <main id="viewer" aria-label="토로 3D 뷰어">
      <div id="viewport"></div>
      <div id="loading" role="status">모델을 불러오는 중…</div>
      <button
        id="fullscreen-button"
        class="fullscreen-button"
        type="button"
        aria-label="가로 전체화면으로 보기"
      >
        <span aria-hidden="true">⛶</span> 전체화면
      </button>
      <div class="controls" aria-label="모델 조작">
        <div class="control-section">
          <span class="control-label" id="expression-label">표정</span>
          <div
            id="expression-controls"
            class="expression-grid"
            role="group"
            aria-labelledby="expression-label"
          ></div>
        </div>
        <div class="control-section animation-section">
          <span class="control-label" id="animation-label">애니메이션</span>
          <div
            class="animation-buttons"
            role="group"
            aria-labelledby="animation-label"
          >
            <button
              type="button"
              data-pose="stand"
              class="selected"
              aria-pressed="true"
            >
              기본
            </button>
            <button type="button" data-pose="wave" aria-pressed="false">
              인사
            </button>
            <button type="button" data-pose="dance" aria-pressed="false">
              춤추기
            </button>
          </div>
        </div>
      </div>
      <dialog id="display-help" aria-labelledby="display-help-title">
        <h2 id="display-help-title">가로 전체화면으로 보기</h2>
        <p id="display-help-message"></p>
        <p id="display-help-steps" hidden></p>
        <button type="button" id="display-help-close">확인</button>
      </dialog>
    </main>
    <script type="module" src="./assets/app-V52NI5SH.js"></script>
  </body>
</html>
